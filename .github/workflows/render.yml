name: Renderizar video

on:
  # Disparado pelo painel assim que voce aprova uma ideia.
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      video_id:
        description: 'ID do video (vazio = pega o proximo da fila)'
        required: false
  schedule:
    # Rede de seguranca: se algum disparo se perder, este cron limpa a fila.
    - cron: '30 10 * * *'

concurrency:
  # Renderizar dois videos ao mesmo tempo brigaria por CPU no runner e deixaria
  # os dois lentos; a fila espera.
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # As chaves (Pexels, R2, TTS) vem do banco, cifradas — preenchidas por
      # voce na tela Configuracoes do painel. Aqui basta como chegar la.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      APP_URL: ${{ vars.APP_URL }}
      VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # O runner do Ubuntu ja traz ffmpeg, mas a linha abaixo garante que ele
      # exista mesmo se a imagem mudar.
      - name: Garantir ffmpeg
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - run: npm install --no-audit --no-fund

      - name: Renderizar
        run: |
          if [ -n "$VIDEO_ID" ]; then
            npm run render
          else
            npm run queue
          fi
