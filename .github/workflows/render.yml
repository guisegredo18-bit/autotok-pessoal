name: Renderizar video

on:
  # Disparado pelo painel assim que voce aprova uma ideia.
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      video_id:
        description: 'ID do video (vazio = pega o proximo da fila)'
        required: false
  schedule:
    # Rede de seguranca: se algum disparo se perder, este cron limpa a fila.
    - cron: '30 10 * * *'

concurrency:
  # Um grupo por video: renderizar dois ao mesmo tempo apenas divide a CPU do
  # runner, mas colocar todos no mesmo grupo fazia um disparo novo cancelar o
  # anterior que ainda esperava vez — e o video ficava preso "na fila".
  group: render-${{ github.event.client_payload.video_id || inputs.video_id || 'fila' }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # As chaves (Pexels, R2, TTS) vem do banco, cifradas — preenchidas por
      # voce na tela Configuracoes do painel. Aqui basta como chegar la.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      APP_URL: ${{ vars.APP_URL }}
      VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}

    steps:
      # Sem actions/checkout de proposito. O servico que resolve actions do
      # marketplace ja saiu do ar e derrubou renderizacoes ("Failed to resolve
      # action download info"); um git clone depende so do proprio Git.
      - name: Baixar o codigo
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .

      # O Node ja vem na imagem do runner, entao setup-node tambem e dispensavel.
      - name: Conferir ambiente
        run: |
          node --version
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - run: npm install --no-audit --no-fund

      - name: Renderizar
        run: |
          if [ -n "$VIDEO_ID" ]; then
            npm run render
          else
            npm run queue
          fi
