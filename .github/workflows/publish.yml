name: Publicar no TikTok

# So roda quando voce aprova um video no painel. Nao ha cron aqui de proposito:
# publicacao e o unico passo irreversivel do fluxo, entao ela sempre parte de
# uma acao sua.
on:
  repository_dispatch:
    types: [publish-video]
  workflow_dispatch:
    inputs:
      video_id:
        description: 'ID do video a publicar'
        required: true

concurrency:
  group: publish-${{ github.event.client_payload.video_id || inputs.video_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Credenciais do TikTok e do armazenamento vem do banco, cifradas.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      APP_URL: ${{ vars.APP_URL }}
      VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}

    steps:
      # Sem actions do marketplace: o servico que as resolve ja saiu do ar e
      # derrubou execucoes. git clone depende so do proprio Git.
      - name: Baixar o codigo
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .

      - run: npm install --no-audit --no-fund

      - name: Publicar
        run: npm run publish
