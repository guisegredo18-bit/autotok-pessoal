name: Tendencias e ideias

# Roda sozinho 3x por dia e tambem sob demanda (botao Run workflow, ou o
# painel disparando repository_dispatch).
on:
  schedule:
    # 06:00, 12:00 e 18:00 no horario de Brasilia (UTC-3).
    - cron: '0 9,15,21 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [scan-trends, generate-ideas]

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      TREND_COUNTRY: ${{ vars.TREND_COUNTRY }}
      TREND_LANGUAGE: ${{ vars.TREND_LANGUAGE }}
      APP_URL: ${{ vars.APP_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      # A varredura pode falhar sozinha (o Creative Center e nao oficial) sem
      # que isso impeca a geracao de ideias com as tendencias ja no banco.
      - name: Buscar tendencias
        if: github.event.action != 'generate-ideas'
        continue-on-error: true
        run: npm run scan

      - name: Gerar ideias
        if: github.event.action != 'scan-trends'
        run: npm run ideas
