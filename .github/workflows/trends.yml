name: Tendencias, ideias e piloto automatico

# Roda sozinho 3x por dia e tambem sob demanda. Nao e o caminho principal para
# gerar ideias — isso tambem funciona direto no painel, com resposta imediata.
# Mas e o caminho principal do piloto automatico: e aqui que o canal anda
# sozinho quando ninguem abre o app.
on:
  schedule:
    # 06:00, 12:00 e 18:00 no horario de Brasilia (UTC-3).
    - cron: '0 9,15,21 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [scan-trends, generate-ideas]

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # O piloto pode renderizar os videos aqui mesmo (motor "aqui"), e cada um
    # leva de dois a quatro minutos. Vinte minutos cortavam o terceiro no meio.
    timeout-minutes: 60
    env:
      # Apenas dois secrets sao necessarios: onde estao as chaves, e com o que
      # elas foram cifradas. Todo o resto (Gemini, Pexels, R2, TikTok, ntfy)
      # e lido do banco, preenchido por voce na tela Configuracoes do painel.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      # Sem actions do marketplace: o servico que as resolve ja saiu do ar e
      # derrubou execucoes. git clone depende so do proprio Git.
      - name: Baixar o codigo
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .

      # O piloto renderiza neste mesmo job quando o motor e "aqui". O binario
      # estatico do npm serviria, mas o do sistema e bem mais rapido.
      - name: Conferir ambiente
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - run: npm install --no-audit --no-fund

      # A coleta automatica depende do Creative Center, que o TikTok fechou.
      # Falhar aqui nao pode impedir a geracao de ideias.
      - name: Buscar tendencias
        if: github.event.action != 'generate-ideas'
        continue-on-error: true
        run: npm run scan

      - name: Gerar ideias
        if: github.event.action != 'scan-trends'
        run: npm run ideas

      # Sem o piloto ligado nas Configuracoes, este passo imprime uma linha e
      # sai. Com ele ligado, e o passo que grava e publica os videos do dia.
      - name: Piloto automatico
        run: npm run auto
